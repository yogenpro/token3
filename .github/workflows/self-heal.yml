name: Recover failed daily collection

on:
  workflow_run:
    workflows: [Collect official prices]
    types: [completed]
  workflow_dispatch:
    inputs:
      failed_run_id:
        description: Failed scheduled collection run ID (at most one attempt, within seven days)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: collection-self-heal
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      vars.ENABLE_SELF_HEALING == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'schedule'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
      issues: write
    outputs:
      mode: ${{ steps.prepare.outputs.mode }}
      issue: ${{ steps.prepare.outputs.issue }}
      base_sha: ${{ steps.prepare.outputs.base_sha }}
      repair_model: ${{ steps.prepare.outputs.repair_model }}
      review_model: ${{ steps.prepare.outputs.review_model }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Validate origin, deduplicate, notify and capture public evidence
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          SELF_HEAL_REPAIR_MODEL: ${{ vars.SELF_HEAL_REPAIR_MODEL }}
          SELF_HEAL_REVIEW_MODEL: ${{ vars.SELF_HEAL_REVIEW_MODEL }}
        run: python -m scripts.self_heal prepare --directory .recovery
      - name: Retain bounded recovery evidence temporarily
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: self-heal-input
          path: .recovery/evidence.json
          retention-days: 7
          if-no-files-found: ignore

  repair:
    needs: prepare
    if: needs.prepare.outputs.mode == 'repair'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: self-heal-input
          path: .recovery
      - name: Require dedicated OpenAI configuration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo '::error::Configure a dedicated OPENAI_API_KEY with a project spending limit before enabling self-healing.'
            exit 1
          fi
      - name: Propose a patch without repository writes or collector secrets
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: '0.161.0'
          model: ${{ needs.prepare.outputs.repair_model }}
          effort: ${{ needs.prepare.outputs.repair_model == 'gpt-6.1-sol' && 'high' || 'medium' }}
          sandbox: read-only
          safety-strategy: drop-sudo
          allow-bot-users: github-actions[bot]
          prompt-file: .github/self-heal/repair.md
          output-schema-file: .github/self-heal/proposal.schema.json
          output-file: .recovery/proposal.json
      - name: Retain the proposed patch temporarily
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: self-heal-proposal
          path: .recovery/proposal.json
          retention-days: 7
          if-no-files-found: ignore

  publish:
    needs: [prepare, repair]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
      actions: write
      issues: write
    outputs:
      ci_ok: ${{ steps.publish.outputs.ci_ok }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: self-heal-input
          path: .recovery
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: self-heal-proposal
          path: .recovery
      - name: Apply deterministic policy, create PR, dispatch and await exact-head CI
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.self_heal publish --directory .recovery
      - name: Retain the exact tested candidate temporarily
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: self-heal-candidate
          path: .recovery/candidate.json
          retention-days: 7
          if-no-files-found: ignore

  review:
    needs: [prepare, publish]
    if: needs.publish.outputs.ci_ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: self-heal-input
          path: .recovery
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: self-heal-proposal
          path: .recovery
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: self-heal-candidate
          path: .recovery
      - name: Independently review without executing candidate code or writing to GitHub
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: '0.161.0'
          model: ${{ needs.prepare.outputs.review_model }}
          effort: high
          sandbox: read-only
          safety-strategy: drop-sudo
          allow-bot-users: github-actions[bot]
          prompt-file: .github/self-heal/review.md
          output-schema-file: .github/self-heal/review.schema.json
          output-file: .recovery/review.json
      - name: Retain the independent review temporarily
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: self-heal-review
          path: .recovery/review.json
          retention-days: 7
          if-no-files-found: ignore

  finalize:
    needs: [prepare, repair, publish, review]
    if: always() && !cancelled() && needs.prepare.outputs.issue != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
      actions: write
      issues: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: self-heal-input
          path: .recovery
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: needs.repair.result == 'success'
        with:
          name: self-heal-proposal
          path: .recovery
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: needs.publish.result == 'success'
        with:
          name: self-heal-candidate
          path: .recovery
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: needs.review.result == 'success'
        with:
          name: self-heal-review
          path: .recovery
      - name: Revalidate review, PR contents and CI; merge or escalate; run replacement collection
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.self_heal finish --directory .recovery
