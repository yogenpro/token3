name: Deploy dashboard

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      collection_sha:
        description: Exact pushed commit from a successful strict main-branch collection
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  resolve:
    if: github.ref == 'refs/heads/main' && vars.ENABLE_PAGES == 'true' && (inputs.collection_sha == '' || vars.ENABLE_COLLECTION_PUBLISH == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
    outputs:
      publish: ${{ steps.snapshot.outputs.publish }}
      sha: ${{ steps.snapshot.outputs.sha }}
      mode: ${{ steps.snapshot.outputs.mode }}
    steps:
      # Controller code is the trusted dispatch/caller SHA, never an artifact.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the exact authorized snapshot
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          COLLECTION_SHA: ${{ inputs.collection_sha }}
        run: python3 -m scripts.resolve_publication

  build:
    needs: resolve
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pages: write
    env:
      PUBLICATION_COMMIT_SHA: ${{ needs.resolve.outputs.sha }}
      PUBLICATION_MODE: ${{ needs.resolve.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - name: Select the GitHub Pages base path
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          if [ "${REPOSITORY_NAME,,}" = "${REPOSITORY_OWNER,,}.github.io" ]; then
            echo 'PAGES_BASE_PATH=/' >> "$GITHUB_ENV"
          else
            echo "PAGES_BASE_PATH=/$REPOSITORY_NAME/" >> "$GITHUB_ENV"
          fi
      - name: Test and build the exact snapshot
        run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Check browser flows and accessibility
        # Browser routes use /; the tested production build above keeps Pages' base.
        run: PAGES_BASE_PATH=/ npm run test:e2e
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the tested static dashboard
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
