name: Report CI and collection failures

on:
  workflow_run:
    workflows: [Check dashboard and collectors, Collect official prices]
    types: [completed]
  workflow_dispatch:
    inputs:
      failed_run_id:
        description: Completed default-branch CI/collection failure to report
        type: string
        required: true
      dry_run:
        description: Preview the handoff in the run summary without writing an issue
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

# Reruns keep their original run ID. Serialize their reporting, not unrelated failures.
concurrency:
  group: failure-issue-${{ github.event.workflow_run.id || inputs.failed_run_id }}
  cancel-in-progress: false

jobs:
  report:
    if: >-
      vars.ENABLE_FAILURE_ISSUES != 'false' &&
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch &&
        contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event.workflow_run.event) &&
        contains(fromJSON('["failure", "timed_out", "startup_failure"]'), github.event.workflow_run.conclusion)))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      # github.sha is the trusted default-branch controller, NEVER workflow_run.head_sha.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Create or update the no-AI failure handoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.ci_failure_issue
